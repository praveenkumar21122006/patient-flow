# Render Blueprint for PatientFlow (Node + Express + MongoDB Atlas).
# Usage: push to GitHub, then Render Dashboard -> New -> Blueprint -> select this repo.
# Set MONGODB_URI (Atlas) and CLIENT_URL (your Render URL) in the dashboard.
services:
  - type: web
    name: patientflow
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: JWT_COOKIE_NAME
        value: pf_token
      - key: COOKIE_SECURE
        value: true
      - key: UPLOAD_MAX_MB
        value: 5
      - key: UPLOAD_RETENTION_DAYS
        value: 90
      - key: HOSPITAL_NAME
        value: City General Hospital
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: PatientFlow <no-reply@patientflow.local>
