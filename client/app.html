<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PatientFlow – Clinical Workspace</title>
<link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
<link rel="stylesheet" href="/css/main.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<a class="skip-link" href="#view">Skip to content</a>
<div class="session-banner" role="alert">Your session will expire soon due to inactivity. Interact with the page to stay signed in. <a href="/pages/login.html">Log in again</a> if needed.</div>
<div class="app">
  <aside class="sidebar" aria-label="Application navigation">
    <a class="brand" href="/app.html#/dashboard"><span class="brand-mark">PF</span> <span>PatientFlow<br><small class="muted" style="color:#8fa3b8;font-weight:400" id="hospital-name">City General Hospital</small></span></a>
    <nav class="side-nav" id="side-nav" aria-label="Sections"></nav>
    <div style="margin-top:auto;padding:12px" class="no-print">
      <div class="small" id="user-card" style="color:#c9d6e2"></div>
      <button class="btn btn-sm btn-outline" id="logout-btn" style="margin-top:8px;color:#fff;border-color:#3b5878">Log out</button>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="btn btn-sm btn-outline hamburger" id="nav-toggle" aria-label="Toggle navigation">☰</button>
      <div><div class="breadcrumbs" id="breadcrumbs">Workspace</div><h1 id="page-title">Dashboard</h1></div>
      <div class="actions" style="margin-left:auto;display:flex;gap:8px;align-items:center">
        <input id="global-search" type="search" placeholder="Search patients…" aria-label="Global patient search" style="max-width:220px">
        <button class="btn btn-sm btn-outline" id="theme-btn" aria-label="Toggle theme">◐ Theme</button>
        <button class="btn btn-sm btn-outline" id="notif-btn" aria-label="Notifications" aria-haspopup="true">🔔 <span id="notif-count" class="badge b-urgent" style="display:none">0</span></button>
        <a class="btn btn-sm btn-outline" href="#/profile" id="profile-link">Profile</a>
      </div>
    </header>
    <div id="notif-panel" class="card" style="display:none;margin:12px 24px 0" role="region" aria-label="Notifications"></div>
    <main class="content" id="view" tabindex="-1"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></main>
  </div>
</div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
