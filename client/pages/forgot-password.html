<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Reset – PatientFlow</title>
<link rel="stylesheet" href="/css/main.css">
</head>
<body>
<header class="site-header"><div class="wrap nav-row"><a class="brand" href="/index.html"><span class="brand-mark">PF</span> PatientFlow</a></div></header>
<main class="wrap section" style="max-width:520px">
<div class="emergency-notice" role="alert"><strong>Emergency notice:</strong> If you believe you are experiencing a medical emergency, contact local emergency services immediately. Do not wait for an online assessment.</div>
<div class="card"><h1 style="font-size:22px">Reset password</h1>
<div id="msg" class="alert alert-info" style="display:none"></div>
<form id="f1"><div class="field"><label for="email">Account email</label><input id="email" type="email" required></div>
<button class="btn btn-primary" style="margin-top:10px" type="submit">Send reset link</button></form>
<form id="f2" style="display:none;margin-top:16px"><div class="field"><label for="token">Reset token</label><input id="token" required></div>
<div class="field" style="margin-top:8px"><label for="pw">New password</label><input id="pw" type="password" required></div>
<button class="btn btn-primary" style="margin-top:10px" type="submit">Set new password</button></form>
</div></main>
<script type="module">
import { api } from '/js/api/client.js';
const msg = document.getElementById('msg');
const show = (t) => { msg.textContent = t; msg.style.display='block'; };
document.getElementById('f1').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const res = await api.post('/auth/forgot-password', { email }).catch((err) => ({ message: err.message }));
  show(res.message || 'If an account exists, a reset link has been sent.');
  if (res.data && res.data.devToken) { document.getElementById('f2').style.display='block'; document.getElementById('token').value = res.data.devToken; }
});
const qp = new URLSearchParams(location.search);
if (qp.get('token')) { document.getElementById('f2').style.display='block'; document.getElementById('token').value = qp.get('token'); }
document.getElementById('f2').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    const res = await api.post('/auth/reset-password', { token: document.getElementById('token').value.trim(), password: document.getElementById('pw').value });
    show(res.message + ' You can now log in.');
  } catch (err) { show(err.message); }
});
</script>
</body>
</html>
